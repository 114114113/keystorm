<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鍵字風暴 KeyStorm - 極速指尖戰防陣線</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #03030c;
      color: #ffffff;
      font-family: 'Noto Sans TC', 'Orbitron', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 賽博朋克背景風格 */
    .bg-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(180deg, rgba(3, 3, 12, 0.9) 0%, rgba(12, 5, 29, 0.7) 60%, rgba(255, 0, 128, 0.15) 100%),
        radial-gradient(circle at 50% 30%, rgba(0, 243, 255, 0.12) 0%, transparent 70%);
      z-index: 1;
    }

    .synth-grid {
      position: absolute;
      bottom: 0;
      width: 200%;
      height: 45vh;
      left: -50%;
      background-image: 
        linear-gradient(to right, rgba(0, 243, 255, 0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 0, 127, 0.3) 1px, transparent 1px);
      background-size: 50px 30px;
      transform: perspective(300px) rotateX(60deg);
      animation: gridMove 2s linear infinite;
      z-index: 1;
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
    }

    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 0 30px; }
    }

    /* 主容器 */
    .game-container {
      position: relative;
      width: 95vw;
      max-width: 1100px;
      height: 88vh;
      max-height: 820px;
      background: rgba(8, 10, 26, 0.75);
      border: 2px solid rgba(0, 243, 255, 0.4);
      border-radius: 16px;
      box-shadow: 
        0 0 30px rgba(0, 243, 255, 0.25),
        inset 0 0 25px rgba(255, 0, 127, 0.15);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      z-index: 10;
      overflow: hidden;
    }

    /* 頂部標題與狀態列 */
    .header-bar {
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(4, 6, 18, 0.85);
      border-bottom: 2px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 20;
    }

    .brand-title h1 {
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #00f3ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
    }

    .brand-title p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* 數據儀表板 */
    .stats-board {
      display: flex;
      gap: 32px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: #00f3ff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.8);
    }

    .stat-value {
      font-family: 'Orbitron', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .stat-value.danger {
      color: #ff0055;
      text-shadow: 0 0 12px rgba(255, 0, 85, 0.9);
      animation: pulseDanger 1s infinite alternate;
    }

    @keyframes pulseDanger {
      from { opacity: 0.8; transform: scale(1); }
      to { opacity: 1; transform: scale(1.08); }
    }

    /* 遊戲畫布 */
    .canvas-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 中打專用輸入區域 */
    .input-zone {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: opacity 0.3s;
    }

    .input-zone.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .zh-input {
      width: 220px;
      padding: 10px 16px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      color: #ffffff;
      background: rgba(10, 15, 35, 0.85);
      border: 2px solid #00f3ff;
      border-radius: 25px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.5), inset 0 0 10px rgba(0, 243, 255, 0.2);
      outline: none;
      font-family: 'Noto Sans TC', sans-serif;
    }

    .zh-input:focus {
      border-color: #ff007f;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.7), inset 0 0 10px rgba(255, 0, 127, 0.3);
    }

    .input-tip {
      font-size: 11px;
      color: #00f3ff;
      letter-spacing: 1px;
      text-shadow: 0 0 5px rgba(0, 243, 255, 0.8);
    }

    /* 彈窗 UI overlay */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 4, 12, 0.82);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .modal-card {
      width: 440px;
      background: rgba(12, 16, 38, 0.95);
      border: 2px solid #00f3ff;
      border-radius: 20px;
      padding: 36px 30px;
      text-align: center;
      box-shadow: 
        0 0 40px rgba(0, 243, 255, 0.4),
        inset 0 0 20px rgba(255, 0, 127, 0.2);
      animation: modalSlideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalSlideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-card h2 {
      font-size: 26px;
      color: #fff;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 0 12px rgba(0, 243, 255, 0.8);
    }

    .modal-card p.subtitle {
      font-size: 13px;
      color: #00f3ff;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* 模式選擇器 */
    .lang-selector {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .btn-lang {
      flex: 1;
      padding: 14px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(0, 243, 255, 0.3);
      border-radius: 14px;
      color: #aaa;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-lang .lang-title {
      font-size: 16px;
      font-weight: 900;
      display: block;
      margin-bottom: 4px;
    }

    .btn-lang .lang-desc {
      font-size: 11px;
      opacity: 0.8;
    }

    .btn-lang:hover {
      border-color: #00f3ff;
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .btn-lang.active {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.25), rgba(255, 0, 127, 0.25));
      border-color: #00f3ff;
      color: #fff;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
    }

    .btn-start {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      background: linear-gradient(90deg, #00f3ff, #ff007f);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
      transition: all 0.25s ease;
      text-transform: uppercase;
    }

    .btn-start:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.8);
    }

    /* 頁腳提示 */
    .footer-tip {
      position: absolute;
      bottom: 12px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 1px;
      z-index: 15;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="synth-grid"></div>

  <div class="game-container">
    <!-- 頂部資訊欄 -->
    <div class="header-bar">
      <div class="brand-title">
        <h1>鍵字風暴 KEYSTORM</h1>
        <p>看見字詞，立即輸入，守住你的防線。</p>
      </div>
      <div class="stats-board">
        <div class="stat-item">
          <div class="stat-label">模式</div>
          <div class="stat-value" id="mode-val">英打</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">分數</div>
          <div class="stat-value" id="score-val">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">漏接掉落</div>
          <div class="stat-value" id="miss-val">0 / 10</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">最高紀錄</div>
          <div class="stat-value" id="high-val">0</div>
        </div>
      </div>
    </div>

    <!-- 主遊戲畫面 -->
    <div class="canvas-wrapper">
      <canvas id="gameCanvas"></canvas>
      
      <!-- 中打專用輸入框區域 -->
      <div class="input-zone hidden" id="input-zone">
        <input type="text" class="zh-input" id="zh-input" placeholder="在此輸入中文..." autocomplete="off">
        <div class="input-tip">選字完成自動擊發 (或按 Enter)</div>
      </div>
    </div>

    <div class="footer-tip" id="footer-tip">
      英打模式：直接按下鍵盤 A-Z 鍵即可發射砲擊
    </div>

    <!-- 開始與重啟 modal 彈窗 -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-card">
        <h2 id="modal-title">選擇打字模式</h2>
        <p class="subtitle" id="modal-desc">
          選擇您想練習的輸入模式。中打模式速度固定方便選字，英打模式速度會持續加快！
        </p>

        <div class="lang-selector">
          <button class="btn-lang active" data-lang="en">
            <span class="lang-title">英打模式</span>
            <span class="lang-desc">A-Z 英文字母 (極速)</span>
          </button>
          <button class="btn-lang" data-lang="zh">
            <span class="lang-title">中打模式</span>
            <span class="lang-desc">常用中文字 (定速)</span>
          </button>
        </div>

        <button class="btn-start" id="btn-start">開始遊戲</button>
      </div>
    </div>
  </div>

  <script>
    // --- 常用繁體中文字庫 ---
    const CHINESE_WORDS = [
      "風", "電", "龍", "影", "光", "閃", "星", "火", "水", "木", "金", "山", "川", "天", "地", 
      "人", "日", "月", "神", "聖", "劍", "盾", "雲", "海", "極", "破", "爆", "夜", "心", "夢", 
      "戰", "勝", "飛", "鷹", "狼", "虎", "獅", "凰", "魔", "幻", "空", "時", "道", "無", "雙", 
      "陣", "雷", "暴", "雪", "冰", "霜", "炎", "熾", "熱", "流", "浪", "濤", "巨", "微", "羽", 
      "翼", "爪", "角", "鱗", "骨", "魂", "魄", "靈", "尊", "王", "皇", "帝", "霸", "雄", "傑", 
      "狂", "傲", "怒", "喜", "樂", "哀", "仇", "恨", "愛", "情", "義", "忠", "勇", "智", "仁"
    ];

    // --- 音效合成器 (Web Audio API) ---
    class SoundFX {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      playShoot() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.12);
        
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      }

      playHit() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
        
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }

      playMiss() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.setValueAtTime(80, this.ctx.currentTime + 0.1);
        
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
      }
    }

    const sound = new SoundFX();

    // --- 遊戲核心變數 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreVal = document.getElementById('score-val');
    const missVal = document.getElementById('miss-val');
    const highVal = document.getElementById('high-val');
    const modeVal = document.getElementById('mode-val');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const btnStart = document.getElementById('btn-start');
    const btnLangs = document.querySelectorAll('.btn-lang');
    const inputZone = document.getElementById('input-zone');
    const zhInput = document.getElementById('zh-input');
    const footerTip = document.getElementById('footer-tip');

    let currentLang = 'en'; // 'en' 或 'zh'
    let score = 0;
    let misses = 0;
    let maxMisses = 10;
    let highScore = localStorage.getItem('keystorm_high') || 0;
    let isPlaying = false;
    let animationFrameId = null;

    highVal.textContent = highScore;

    let letters = [];
    let lasers = [];
    let particles = [];
    let lastSpawnTime = 0;

    // Canvas 響應式螢幕調整
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 選擇語系模式
    btnLangs.forEach(btn => {
      btn.addEventListener('click', () => {
        btnLangs.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLang = btn.dataset.lang;
      });
    });

    // 開始遊戲
    btnStart.addEventListener('click', () => {
      sound.init();
      modalOverlay.classList.add('hidden');
      resetGame();
      isPlaying = true;

      if (currentLang === 'zh') {
        inputZone.classList.remove('hidden');
        footerTip.textContent = "中打模式：使用中文輸入法選字，輸入完成自動擊落目標 (速度固定)";
        setTimeout(() => zhInput.focus(), 100);
      } else {
        inputZone.classList.add('hidden');
        footerTip.textContent = "英打模式：直接按下鍵盤 A-Z 鍵即可發射砲擊 (速度遞增)";
      }

      lastSpawnTime = performance.now();
      requestAnimationFrame(gameLoop);
    });

    function resetGame() {
      score = 0;
      misses = 0;
      letters = [];
      lasers = [];
      particles = [];
      zhInput.value = '';
      
      scoreVal.textContent = score;
      modeVal.textContent = currentLang === 'en' ? '英打' : '中打';
      missVal.textContent = `${misses} / ${maxMisses}`;
      missVal.classList.remove('danger');
    }

    // 生成掉落字詞（英文字母或單一中文字）
    function spawnLetter() {
      let char = "";
      let radius = 36; // 基礎半徑
      let speed = 1.0;

      if (currentLang === 'en') {
        char = String.fromCharCode(65 + Math.floor(Math.random() * 26));
        // 英打模式：速度隨分數遞增
        const baseSpeed = 1.8;
        const speedMultiplier = 1 + (score * 0.04);
        speed = (baseSpeed + Math.random() * 0.5) * speedMultiplier;
      } else {
        char = CHINESE_WORDS[Math.floor(Math.random() * CHINESE_WORDS.length)];
        radius = 40; // 中文字體稍大，增加氣泡尺寸
        // 中打模式：速度維持恆定舒適速度，不隨分數加速
        speed = 1.1 + Math.random() * 0.2;
      }

      const padding = 70;
      const x = padding + Math.random() * (canvas.width - padding * 2);

      letters.push({
        char: char,
        x: x,
        y: -radius * 2,
        radius: radius,
        speed: speed,
        color: Math.random() > 0.5 ? '#00f3ff' : '#ff007f'
      });
    }

    // 繪製砲台與防禦線
    function drawBase() {
      const groundY = canvas.height - (currentLang === 'zh' ? 80 : 40);
      
      // 防禦線
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 15;
      ctx.stroke();

      // 底座三角形
      const centerX = canvas.width / 2;
      ctx.beginPath();
      ctx.moveTo(centerX, groundY - 24);
      ctx.lineTo(centerX - 24, groundY + 12);
      ctx.lineTo(centerX + 24, groundY + 12);
      ctx.closePath();

      ctx.fillStyle = '#00f3ff';
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 20;
      ctx.fill();

      // 中心核
      ctx.beginPath();
      ctx.arc(centerX, groundY - 4, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.restore();
    }

    // 英打按鍵監聽
    window.addEventListener('keydown', (e) => {
      if (!isPlaying || currentLang !== 'en') return;

      const key = e.key.toUpperCase();
      if (key >= 'A' && key <= 'Z') {
        eliminateTarget(key);
      }
    });

    // 中打輸入監聽（即時比對與 Enter 事件）
    zhInput.addEventListener('input', () => {
      if (!isPlaying || currentLang !== 'zh') return;
      const val = zhInput.value.trim();
      if (val.length > 0) {
        // 取最後一個輸入的中文字比對
        const lastChar = val.charAt(val.length - 1);
        const hit = eliminateTarget(lastChar);
        if (hit) {
          zhInput.value = ''; // 命中後清空輸入框
        }
      }
    });

    zhInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = zhInput.value.trim();
        if (val.length > 0) {
          eliminateTarget(val);
          zhInput.value = '';
        }
      }
    });

    // 中打時維持輸入框 Focus 焦點
    document.addEventListener('click', () => {
      if (isPlaying && currentLang === 'zh') {
        zhInput.focus();
      }
    });

    // 擊落比對與射擊邏輯
    function eliminateTarget(targetChar) {
      let targetIndex = -1;
      let maxY = -Infinity;

      // 尋找符合文字且最接近底部的目標
      for (let i = 0; i < letters.length; i++) {
        if (letters[i].char === targetChar && letters[i].y > maxY) {
          maxY = letters[i].y;
          targetIndex = i;
        }
      }

      if (targetIndex !== -1) {
        const target = letters[targetIndex];
        const groundY = canvas.height - (currentLang === 'zh' ? 80 : 40);
        const cannonX = canvas.width / 2;
        const cannonY = groundY - 24;

        // 生成雷射
        lasers.push({
          x1: cannonX,
          y1: cannonY,
          x2: target.x,
          y2: target.y,
          alpha: 1,
          color: target.color
        });

        // 生成爆炸粒子
        createExplosion(target.x, target.y, target.color);

        // 移除目標並加分
        letters.splice(targetIndex, 1);
        score += 1;
        scoreVal.textContent = score;

        sound.playHit();
        sound.playShoot();
        return true;
      }
      return false;
    }

    // 生成爆炸粒子
    function createExplosion(x, y, color) {
      const count = 16;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random();
        const speed = 2 + Math.random() * 5;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 2 + Math.random() * 3,
          alpha: 1,
          color: color
        });
      }
    }

    // 主繪製與更新循環
    function gameLoop(timestamp) {
      if (!isPlaying) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 動態生成間隔 (中打恆定維持 2000ms 生成一顆)
      let currentInterval = 2000;
      if (currentLang === 'en') {
        const baseInterval = 1100;
        currentInterval = Math.max(200, baseInterval - (score * 18));
      }

      if (timestamp - lastSpawnTime > currentInterval) {
        spawnLetter();
        lastSpawnTime = timestamp;
      }

      const groundY = canvas.height - (currentLang === 'zh' ? 80 : 40);

      // 1. 更新與繪製目標
      for (let i = letters.length - 1; i >= 0; i--) {
        const item = letters[i];
        item.y += item.speed;

        // 檢查觸底（漏接）
        if (item.y + item.radius >= groundY) {
          misses++;
          missVal.textContent = `${misses} / ${maxMisses}`;
          if (misses >= 7) missVal.classList.add('danger');

          sound.playMiss();
          createExplosion(item.x, groundY, '#ff0055');
          letters.splice(i, 1);

          if (misses >= maxMisses) {
            gameOver();
            return;
          }
          continue;
        }

        // 繪製高對比底色與霓虹氣泡外框
        ctx.save();
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#060814'; // 純深色黑底，提升對比度
        ctx.strokeStyle = item.color;
        ctx.lineWidth = 3.5;
        ctx.shadowColor = item.color;
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.stroke();

        // 繪製清晰字體
        const fontSize = currentLang === 'en' ? '32px' : '28px';
        const fontStyle = currentLang === 'en' ? '"Orbitron"' : '"Noto Sans TC"';
        ctx.font = `900 ${fontSize} ${fontStyle}, sans-serif`;
        
        // 雙重黑邊描邊確保清晰
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 5;
        ctx.strokeText(item.char, item.x, item.y + 2);

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = item.color;
        ctx.shadowBlur = 10;
        ctx.fillText(item.char, item.x, item.y + 2);
        ctx.restore();
      }

      // 2. 繪製雷射光束
      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(l.x1, l.y1);
        ctx.lineTo(l.x2, l.y2);
        ctx.strokeStyle = l.color;
        ctx.globalAlpha = l.alpha;
        ctx.lineWidth = 4;
        ctx.shadowColor = l.color;
        ctx.shadowBlur = 15;
        ctx.stroke();
        ctx.restore();

        l.alpha -= 0.12;
        if (l.alpha <= 0) lasers.splice(i, 1);
      }

      // 3. 繪製爆炸粒子
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }

      // 4. 繪製防線與砲台
      drawBase();

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    // 遊戲結束
    function gameOver() {
      isPlaying = false;
      cancelAnimationFrame(animationFrameId);
      inputZone.classList.add('hidden');

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('keystorm_high', highScore);
        highVal.textContent = highScore;
      }

      modalTitle.textContent = "戰局結束 GAME OVER";
      modalDesc.innerHTML = `最終得分：<strong style="color:#00f3ff; font-size: 22px;">${score}</strong> 分<br>準備好再次挑戰極限了嗎？`;
      btnStart.textContent = "再次挑戰";
      modalOverlay.classList.remove('hidden');
    }
  </script>
